[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-low-snr"
version = "0.1.0"
description = "Investigation of Cross-Entropy's implicit max-margin bias under low-SNR and invariant covariate shift"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nick Hunt" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
